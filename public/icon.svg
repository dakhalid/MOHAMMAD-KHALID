<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle glow -->
  <circle cx="256" cy="240" r="170" fill="#10b981" opacity="0.08"/>

  <!-- Main Wallet Body -->
  <g filter="url(#shadow)">
    <!-- Back card / document -->
    <rect x="136" y="140" width="240" height="150" rx="20" fill="url(#cardGrad)" opacity="0.9"/>
    <!-- Wallet base -->
    <rect x="116" y="180" width="280" height="190" rx="24" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <!-- Wallet flap -->
    <path d="M 116 196 C 116 186, 124 180, 136 180 L 376 180 C 388 180, 396 186, 396 196 L 396 230 C 396 242, 386 252, 374 252 L 138 252 C 126 252, 116 242, 116 230 Z" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <!-- Vault / Shield Lock Clasp -->
    <g transform="translate(320, 240)">
      <rect x="-8" y="-18" width="60" height="48" rx="14" fill="url(#accentGrad)"/>
      <path d="M 14 -2 C 14 -8, 20 -12, 26 -12 C 32 -12, 38 -8, 38 -2 L 38 4 L 14 4 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="26" cy="12" r="4" fill="#ffffff"/>
      <path d="M 26 16 L 26 22" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Card detail line -->
    <path d="M 146 220 L 290 220" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <!-- Currency / growth pill -->
    <rect x="146" y="295" width="130" height="38" rx="10" fill="#0f172a"/>
    <text x="162" y="321" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20">$ · 🔒</text>
  </g>
</svg>
